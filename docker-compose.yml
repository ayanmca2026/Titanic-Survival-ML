version: '3.8'
services:
  api:
    build: .
    ports:
      - "8000:8000"
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./models:/app/models
      - ./data:/app/data
  dashboard:
    build: .
    ports:
      - "8501:8501"
    command: streamlit run src/dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    volumes:
      - ./models:/app/models
      - ./data:/app/data
